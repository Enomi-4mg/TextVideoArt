<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Try experimental browser-side camera-to-text preview with tvart." />
    <meta property="og:title" content="tvart WebCam Preview" />
    <meta property="og:description" content="Try experimental browser-side camera-to-text preview with tvart." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://enomi-4mg.github.io/TextVideoArt/web/examples/webcam-preview/" />
    <meta name="twitter:card" content="summary" />
    <title>tvart WebCam Preview</title>
    <link rel="stylesheet" href="./styles.css?v=mobile-controls" />
  </head>
  <body>
    <main id="preview-surface" class="preview-surface">
      <pre id="frame-output" class="frame-output" aria-live="off">Waiting for camera.</pre>

      <video id="camera-video" class="is-hidden" playsinline muted></video>
      <canvas id="sample-canvas" class="is-hidden"></canvas>

      <button
        id="controls-toggle"
        class="overlay-toggle"
        type="button"
        aria-controls="controls-overlay"
        aria-expanded="true"
      >
        Hide Controls
      </button>

      <section id="controls-overlay" class="overlay controls-overlay" aria-label="WebCam preview controls">
        <div class="title-block">
          <h1>WebCam Preview</h1>
          <p>Experimental browser-side text preview.</p>
        </div>

        <div class="button-row">
          <button id="start-button" type="button">Start Camera</button>
          <button id="stop-button" type="button" disabled>Stop Camera</button>
        </div>

        <label>
          <span>FPS</span>
          <input id="fps-input" type="number" min="0.1" step="0.1" value="10" />
        </label>

        <label>
          <span>Charset</span>
          <input id="charset-input" type="text" value=" .:-=+*#%@" spellcheck="false" />
        </label>

        <label>
          <span>Aspect</span>
          <input id="aspect-input" type="number" min="0.01" step="0.05" value="0.5" />
        </label>

        <label class="checkbox">
          <input id="invert-input" type="checkbox" />
          <span>Invert</span>
        </label>

        <div id="status" class="status" role="status">Waiting for camera.</div>
      </section>

    </main>

    <script type="module" src="./app.js?v=mobile-controls"></script>
  </body>
</html>
