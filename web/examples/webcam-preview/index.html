<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Try experimental browser-side camera-to-text preview with tvart." />
    <meta property="og:title" content="tvart WebCam Preview" />
    <meta property="og:description" content="Try experimental browser-side camera-to-text preview with tvart." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://enomi-4mg.github.io/TextVideoArt/web/examples/webcam-preview/" />
    <meta name="twitter:card" content="summary" />
    <title>tvart WebCam Preview</title>
    <link rel="stylesheet" href="./styles.css?v=camera-fit" />
  </head>
  <body>
    <main id="preview-surface" class="preview-surface">
      <section id="preview-stage" class="preview-stage" aria-label="WebCam text preview">
        <canvas id="frame-canvas" class="frame-canvas" aria-label="WebCam text output"></canvas>
        <pre id="frame-output" class="frame-output" aria-live="off">Waiting for camera.</pre>
      </section>

      <video id="camera-video" class="is-hidden" playsinline muted></video>
      <canvas id="sample-canvas" class="is-hidden"></canvas>

      <button
        id="controls-toggle"
        class="overlay-toggle"
        type="button"
        aria-controls="controls-overlay"
        aria-expanded="true"
      >
        Hide Controls
      </button>

      <section id="controls-overlay" class="overlay controls-overlay" aria-label="WebCam preview controls">
        <div class="title-block">
          <h1>WebCam Preview</h1>
        </div>

        <div class="button-row">
          <button id="start-button" type="button">Start Camera</button>
          <button id="stop-button" type="button" disabled>Stop Camera</button>
        </div>

        <label>
          <span>FPS</span>
          <input id="fps-input" type="number" min="1" step="1" value="10" />
        </label>

        <label>
          <span>Resolution</span>
          <input id="resolution-input" type="number" min="1" max="64" step="1" value="24" />
        </label>

        <label>
          <span>Charset</span>
          <select id="charset-input">
            <option value="standard">Standard</option>
            <option value="simple">Simple</option>
            <option value="blocks">Blocks</option>
            <option value="dense">Dense</option>
          </select>
        </label>

        <label>
          <span>Aspect</span>
          <input id="aspect-input" type="number" min="0.01" step="0.05" value="1" />
        </label>

        <label class="checkbox">
          <input id="invert-input" type="checkbox" />
          <span>Invert</span>
        </label>

        <div id="status" class="status" role="status">Waiting for camera.</div>
      </section>

    </main>

    <script type="module" src="./app.js?v=camera-fit"></script>
  </body>
</html>
