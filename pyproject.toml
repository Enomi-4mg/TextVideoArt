[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvart"
version = "0.2.0"
description = "A CLI tool for creating and playing TVA (Text Video Art) files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
]

[project.scripts]
tvart = "tvart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
